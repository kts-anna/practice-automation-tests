name: UI tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 🟢 | AI
      #
      # README обещает Firefox, но в CI проверяется только Chrome — добавьте matrix по
      # браузерам. Ещё: нет кэша pip (actions/setup-python, cache: pip), а в артефакт
      # кладутся только сырые allure-results — собранный отчёт (allure generate) или
      # публикация на GitHub Pages сделали бы его доступным без локального Allure.
      - name: Run tests (Chrome headless)
        run: pytest --browser=chrome --headless

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
